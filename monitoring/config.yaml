name: Monitoring
version: "2.9.2"
slug: monitoring
description: Supervise des boîtes mail, des API, des pings et des équipements SNMP, avec un tableau de bord dans la barre latérale.
url: https://github.com/Jcpasdutout/ha-monitoring
arch:
  - aarch64
  - amd64
init: false
discovery:
  - ha_monitoring
# Nécessaire pour lire le nom d'hôte de l'add-on (/addons/self/info) avant l'annonce.
hassio_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:monitor-dashboard
panel_title: Monitoring
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Accès direct (intégration Monitoring, navigateur). Laisser vide pour le désactiver.
map:
  - type: share
    read_only: true
options:
  reset_admin: false
schema:
  reset_admin: bool
