name: Release

# Crée automatiquement une release GitHub (vX.Y.Z) quand la version du manifest de
# l'intégration change sur main. HACS affiche alors « 1.1.0 » au lieu d'un numéro de commit.
on:
  push:
    branches: [main]
    paths: [custom_components/ha_monitoring/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release si elle n'existe pas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/ha_monitoring/manifest.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La release $tag existe déjà."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
